# Grasp and lift, scored on the OBJECT: approach the grasp point, close, lift -- and the
# question at the end is whether the butter (or the bowl) went up with the tool and is still
# between the jaws. The tool's own numbers cannot tell a lift from a lift of nothing.
#
# Chains are sequential: a subgoal that fails ends its chain, since the next one would start
# from a state the failed one was supposed to produce. Each chain restarts from the task's
# initial state.

version: 1
suite: libero_10
task_id: 0
sequential: true

subgoals:
  # ---- butter: a box taken from above ----
  - name: butter_approach
    suite: libero_10
    task_id: 0
    subgoal: >
      bring the gripper to just above the centre of the top of the butter box, low enough to
      grasp it: come down as you go, and keep correcting sideways so you stay over its middle
    criterion: >
      In the wrist view the butter box -- the small box with the red and white BUTTER label --
      sits between the jaws with its middle centred in the gap, and the clearance below the
      tool is down to roughly 30 mm. Judge this from the jaws once you are close.
    check: {fn: at_grasp_point, body: butter_1_main, part: top, within_mm: 25, above_mm: [-5, 50]}
    max_cycles: 12
    # the approach is a precondition here, not what is under test: score it, carry on
    continue_on_fail: true

  - name: butter_grasp
    subgoal: close the gripper on the butter box so that it is held
    criterion: The robot reports that it is holding something.
    check: {fn: holding_object}
    # room for one full recovery: open, up 100, re-align, down, down, close
    max_cycles: 10

  - name: butter_lift
    subgoal: lift the butter box straight up by about 10 cm, keeping hold of it
    criterion: >
      The tool's z has increased by at least 80 mm from where this subgoal started and the
      robot still reports holding something.
    check: {fn: object_lifted, body: butter_1_main, at_least_mm: 60}
    max_cycles: 4

  # ---- bowl: taken by the rim ----
  - name: bowl_approach
    suite: libero_goal
    task_id: 0
    subgoal: >
      bring the gripper to the rim of the black bowl where the jaws can pinch it: the LEFT or
      RIGHT side of the bowl as the wrist camera sees it, where the rim runs up-down the
      picture through the middle of the gap between the jaws, so one jaw is over the bowl's
      inside and the other over the table outside. Come down as you go, and keep correcting
      sideways so that stretch of rim stays centred between the jaws
    criterion: >
      In the wrist view the bowl's rim passes up-down the picture through the centre of the
      gap between the jaws -- one jaw over the bowl's inside, the other over the table
      outside it -- and the tool is level with the rim or a little below it. Judge this from
      the jaws once you are close.
    check: {fn: at_grasp_point, body: akita_black_bowl_1_main, part: rim, within_mm: 25, above_mm: [-20, 40]}
    max_cycles: 12
    continue_on_fail: true

  - name: bowl_grasp
    subgoal: close the gripper on the rim of the bowl so that the rim is held between the jaws
    criterion: The robot reports that it is holding something.
    check: {fn: holding_object}
    # room for one full recovery: open, up 100, re-align, down, down, close
    max_cycles: 10

  - name: bowl_lift
    subgoal: lift the bowl straight up by about 10 cm, keeping hold of it
    criterion: >
      The tool's z has increased by at least 80 mm from where this subgoal started and the
      robot still reports holding something.
    check: {fn: object_lifted, body: akita_black_bowl_1_main, at_least_mm: 60}
    max_cycles: 4
